project:
  name: LV-XAI
  seed: 42

data:
  image_size: 224
  segmentation_image_size: 256
  num_classes: 2
  supported_image_extensions:
    - .png
    - .jpg
    - .jpeg
    - .tif
    - .tiff
    - .bmp
  segmentation_mask_extensions:
    - .png
    - .jpg
    - .jpeg
    - .tif
    - .tiff
    - .bmp

segmentation:
  model: unet
  input_channels: 1
  output_channels: 1
  batch_size: 8
  epochs: 50
  learning_rate: 0.0001
  threshold: 0.5

classification:
  model: resnet18
  pretrained: true
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  num_classes: 2

training:
  optimizer: adam
  weight_decay: 0.0001
  early_stopping_patience: 7

xai:
  gradcam: true
  shap: true

paths:
  segmentation_data: data/raw/segmentation
  classification_data: data/raw/classification
  processed_data: data/processed
  models: models
  outputs: outputs

